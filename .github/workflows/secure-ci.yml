# Reusable pipeline shared by every dashboard. A dashboard's own workflow calls it:
#   uses: <owner>/dashboard-security-kit/.github/workflows/secure-ci.yml@v1.0.0
#
#   verify  — typecheck, lint, security tests, build, bundle scan, dependency audit
#   secrets — gitleaks over the full git history
#   audit   — read-only check of the client's Cloudflare settings (Access, MFA, TLS, side doors)
#   deploy  — only after all of the above pass, only from main, in the "production" environment
name: Dashboard secure pipeline

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      audit:
        type: boolean
        default: false
      app-hostname:
        type: string
        default: ""
      worker-name:
        type: string
        default: ""
      account-id:
        type: string
        default: ""
      zone-id:
        type: string
        default: ""
      mfa-mode:
        type: string
        default: "access"
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Audit all dependencies (report only)
        run: npm audit || true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI itself (MIT, free everywhere). The gitleaks GitHub Action needs a paid
      # license on organization accounts, which is where client repos live.
      - name: Install gitleaks (exact version, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  audit:
    name: cloudflare-audit
    if: inputs.audit || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Check Cloudflare account settings (read-only)
        env:
          CF_AUDIT_TOKEN: ${{ secrets.CF_AUDIT_TOKEN }}
          CF_ACCOUNT_ID: ${{ inputs.account-id }}
          CF_ZONE_ID: ${{ inputs.zone-id }}
          APP_HOSTNAME: ${{ inputs.app-hostname }}
          WORKER_NAME: ${{ inputs.worker-name }}
          MFA_MODE: ${{ inputs.mfa-mode }}
        run: npx dashboard-security-kit check-cloudflare

  deploy:
    name: deploy
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: [verify, secrets, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ inputs.app-hostname }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npx dashboard-security-kit check-bundle
      - name: Deploy to the client's Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        run: npx wrangler deploy --env production
      - name: Sync Worker secrets (staff list, CSRF key, 2FA keys) from the production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          MFA_SESSION_SECRET: ${{ secrets.MFA_SESSION_SECRET }}
          MFA_MODE: ${{ inputs.mfa-mode }}
        run: |
          umask 077
          f="$RUNNER_TEMP/worker-secrets.json"
          node -e 'const app=process.env.MFA_MODE==="app";const k=["ALLOWED_EMAILS","ADMIN_EMAILS","CSRF_SECRET",...(app?["MFA_ENCRYPTION_KEY","MFA_SESSION_SECRET"]:[])];const m=k.filter(x=>!process.env[x]&&x!=="ADMIN_EMAILS");if(m.length){console.error("Missing production secrets: "+m.join(", "));process.exit(1)}require("fs").writeFileSync(process.argv[1],JSON.stringify(Object.fromEntries(k.map(x=>[x,process.env[x]??""]))))' "$f"
          npx wrangler secret bulk "$f" --env production
          rm -f "$f"
      - name: Check the live site from the outside
        run: npx dashboard-security-kit check-live "https://${{ inputs.app-hostname }}"
